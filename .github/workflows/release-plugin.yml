---
name: "Release NEXT.js revalidate plugin"

# Every action is pinned to a commit SHA, with the release it resolves to in a
# comment. A tag or a branch can be moved to other code, and this job holds
# `contents: write` and the release-belt SSH key. Dependabot bumps the SHA and the
# comment together (ADR 0032).

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # release-belt's SSH host key is pinned, so the upload only goes to the real
      # server: without it ssh-deploy connects with StrictHostKeyChecking=no and
      # trusts whatever key it is shown. The key comes from the
      # RELEASE_BELT_KNOWN_HOSTS organization secret: the `ssh-keyscan -p <port>
      # <host>` line(s) (`-H` hashed lines work too), checked against the
      # fingerprints from `ssh-keygen -lf /etc/ssh/ssh_host_*_key.pub` on the
      # server by someone with access to it.
      #
      # It runs first, so a missing or malformed secret fails the job before
      # anything is built or published. $RUNNER_TEMP lasts for the whole job, so
      # "Upload to release-belt" still reads the file written here. A well-formed
      # key that doesn't match the server is only caught at the upload.
      #
      # When release-belt's host key changes, the upload fails with "Host key
      # verification failed" (and the fingerprints logged below no longer match
      # the server's). Replace the secret with the new, verified line(s); don't
      # switch the check off.
      - name: Pin release-belt's SSH host key
        shell: bash
        env:
          KNOWN_HOSTS: ${{ secrets.RELEASE_BELT_KNOWN_HOSTS }}
        run: |
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::The RELEASE_BELT_KNOWN_HOSTS organization secret is missing or empty, so release-belt's SSH host key can't be verified. Create it (see the comment above this step), then re-run the job: nothing has been built or published yet."
            exit 1
          fi
          umask 077
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/release_belt_known_hosts"
          if ! fingerprints=$(ssh-keygen -lf "$RUNNER_TEMP/release_belt_known_hosts"); then
            echo "::error::RELEASE_BELT_KNOWN_HOSTS holds no valid known_hosts line (expected \`ssh-keyscan -p <port> <host>\` output). Fix the secret, then re-run the job: nothing has been built or published yet."
            exit 1
          fi
          # Bits, fingerprint and key type only, to compare with the server's.
          awk '{ print $1, $2, $NF }' <<<"$fingerprints"

      # PHP Composer dependencies
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "7.4"
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ github.token }}
      - id: composer-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-
      - shell: bash
        run: composer install --no-dev --prefer-dist --no-progress

      - name: Install node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies & build assets
        run: |
          npm ci
          npm run build

      # The payload is an allowlist: only the paths named below ship, everything
      # else in the checkout stays behind. Adding a file to the repo root can no
      # longer leak it into the zip. Forgetting a path the plugin needs at runtime
      # breaks it visibly in testing, and rsync exits non-zero on a path that is
      # missing entirely — a failed asset build fails the release instead of
      # quietly publishing a zip without dist/.
      #
      # Add an entry here only when the plugin needs it at runtime. Development
      # tooling (src/, config/, webpack.config.js, package.json, tsconfig.json,
      # composer.json, .wp-env.json), documentation and agent files do not.
      - name: Assemble plugin payload
        shell: bash
        run: |
          mkdir -p nextjs-revalidate
          rsync -r --files-from=- . ./nextjs-revalidate <<'EOF'
          nextjs-revalidate.php
          readme.txt
          include/
          dist/
          languages/
          vendor/
          EOF

      # The runner's own zip. The action this replaced built `FROM alpine:latest`
      # and ran `apk add zip` on every release, so no pin could fix what ran
      # (ADR 0032).
      - name: Archive Release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: zip -qq -r "nextjs-revalidate-$TAG.zip" nextjs-revalidate

      # Created as a draft, and published by the next step. The action cannot say
      # whether a release is "Latest", and GitHub makes every newly published
      # release Latest by default, so a v1.7.1 tagged after v2.0.0 would take it
      # (ADR 0031). A draft is never Latest. The changelog stays the action's: it
      # picks the previous tag by semver, so a v1.x release lists v1.x commits.
      #
      # Pinned to what its `latest` tag resolves to, three rebuilds of `dist/` past
      # v1.2.1. The repository is archived, so Dependabot will never bump this pin.
      - uses: marvinpinto/action-automatic-releases@d68defdd11f9dcc7f52f35c1b7c236ee7513bcc1 # latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          draft: true
          files: |
            nextjs-revalidate-${{  github.ref_name }}.zip

      # "Latest" goes to the highest version released so far, never to the newest
      # release: this tag takes it only when no published release outranks it.
      # `sort -V` puts v1.10.0 above v1.9.0, which a plain sort does not.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          highest=$(
            {
              gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
                --limit 1000 --json tagName --jq '.[].tagName'
              echo "$TAG"
            } | sort -V | tail -n 1
          )
          if [ "$highest" = "$TAG" ]; then latest=true; else latest=false; fi
          echo "Highest released version: $highest. Publishing $TAG with Latest=$latest."
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"

      # SSH_CMD_ARGS replaces the action's `-o StrictHostKeyChecking=no` default:
      # the action splits it on commas and appends the options to rsync's `--rsh`
      # ssh command, which then trusts only the file written by "Pin release-belt's
      # SSH host key". Don't set SCRIPT_BEFORE/SCRIPT_AFTER: the action runs those
      # over a separate ssh command with StrictHostKeyChecking=no hardcoded,
      # ignoring SSH_CMD_ARGS.
      #
      # If this step fails, the GitHub release is already published. Don't re-run
      # the job; upload the zip attached to the release by hand under the TARGET
      # name below.
      - name: Upload to release-belt
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.RELEASE_BELT_PUBLISH_PRIVATE_KEY }}
          REMOTE_USER: ${{ secrets.RELEASE_BELT_USER }}
          REMOTE_HOST: ${{ secrets.RELEASE_BELT_HOST }}
          REMOTE_PORT: ${{ secrets.RELEASE_BELT_PORT }}
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=yes, -o UserKnownHostsFile=${{ runner.temp }}/release_belt_known_hosts, -o GlobalKnownHostsFile=/dev/null"
          SOURCE: nextjs-revalidate-${{  github.ref_name }}.zip
          TARGET: "${{ secrets.RELEASE_BELT_PATH }}/releases/wordpress-plugin/superhuit/nextjs-revalidate-${{  github.ref_name }}.zip"
