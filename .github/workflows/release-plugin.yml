---
name: "Release NEXT.js revalidate plugin"

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # PHP Composer dependencies
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
        env:
          COMPOSER_TOKEN: ${{ github.token }}
      - id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-
      - shell: bash
        run: composer install --no-dev --prefer-dist --no-progress

      - name: Install node
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies & build assets
        run: |
          npm ci
          npm run build

      # The payload is an allowlist: only the paths named below ship, everything
      # else in the checkout stays behind. Adding a file to the repo root can no
      # longer leak it into the zip. Forgetting a path the plugin needs at runtime
      # breaks it visibly in testing, and rsync exits non-zero on a path that is
      # missing entirely — a failed asset build fails the release instead of
      # quietly publishing a zip without dist/.
      #
      # Add an entry here only when the plugin needs it at runtime. Development
      # tooling (src/, config/, webpack.config.js, package.json, tsconfig.json,
      # composer.json, .wp-env.json), documentation and agent files do not.
      - name: Assemble plugin payload
        shell: bash
        run: |
          mkdir -p nextjs-revalidate
          rsync -r --files-from=- . ./nextjs-revalidate <<'EOF'
          nextjs-revalidate.php
          readme.txt
          include/
          dist/
          languages/
          vendor/
          EOF

      - name: Archive Release
        uses: montudor/action-zip@v1
        with:
          args: zip -qq -r nextjs-revalidate-${{  github.ref_name }}.zip nextjs-revalidate

      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          files: |
            nextjs-revalidate-${{  github.ref_name }}.zip

      - name: Upload to release-belt
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.RELEASE_BELT_PUBLISH_PRIVATE_KEY }}
          REMOTE_USER: ${{ secrets.RELEASE_BELT_USER }}
          REMOTE_HOST: ${{ secrets.RELEASE_BELT_HOST }}
          REMOTE_PORT: ${{ secrets.RELEASE_BELT_PORT }}
          SOURCE: nextjs-revalidate-${{  github.ref_name }}.zip
          TARGET: "${{ secrets.RELEASE_BELT_PATH }}/releases/wordpress-plugin/superhuit/nextjs-revalidate-${{  github.ref_name }}.zip"
